name: Auto Pack Archive

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create ZIP Archive
        run: |
          # Completely remove GitHub internal hidden folders before packing
          rm -rf .git .github
          # Pack only your STL folders
          zip -r archive.zip . -x "README.md" "Tessera Title.png"

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: latest
          name: "Latest Version"
          body: "The archive is updated automatically whenever new files are added."
          files: archive.zip
