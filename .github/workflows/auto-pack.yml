name: Auto Pack Archive

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create ZIP Archive
        run: |
          rm -rf .git .github
          zip -r archive.zip . -x "README.md" "Tessera Title.png"

      - name: Generate Version Tag
        id: version
        run: |
          # Создает тег на основе даты и времени, например: v2026.10.25-1915
          echo "tag=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: latest
          name: "Latest Version (${{ steps.version.outputs.tag }})"
          body: "The archive is updated automatically. Current build: ${{ steps.version.outputs.tag }}"
          files: archive.zip
